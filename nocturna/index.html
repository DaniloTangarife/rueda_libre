<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rueda Nocturna: descubre Medellín en bici cuando se encienden las luces. Nuevo, jueves a sábado.">
    <title>Rueda Nocturna | Rueda Libre</title>

    <!-- CSS generado por Tailwind CLI (NO el Play CDN) -->
    <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 antialiased">

    <main class="min-h-screen flex items-center justify-center px-6 py-16">
        <section class="w-full max-w-3xl space-y-8">

            <!-- Etiqueta de campaña -->
            <span class="inline-block rounded-full bg-amber-400 text-slate-900 text-xs font-bold uppercase tracking-widest px-4 py-1">
                Nuevo · Jueves a sábado
            </span>

            <!-- Título principal (único h1) -->
            <h1 class="text-5xl md:text-7xl font-extrabold leading-tight tracking-tight text-white">
                Rueda Nocturna
            </h1>

            <!-- Subtítulo -->
            <p class="text-lg md:text-2xl text-slate-300 leading-relaxed max-w-2xl">
                Descubre Medellín en bici cuando se encienden las luces.
            </p>

            <!-- Datos destacados -->
            <dl class="flex flex-wrap gap-8 md:gap-12 pt-4">
                <div class="space-y-1">
                    <dt class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Rutas</dt>
                    <dd class="text-3xl md:text-4xl font-bold text-white">3 rutas</dd>
                </div>
                <div class="space-y-1">
                    <dt class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Precio</dt>
                    <dd class="text-3xl md:text-4xl font-bold text-amber-400">Desde $55.000</dd>
                </div>
            </dl>

            <!-- ===== KIT DE BOTONES (Reto 2) ===== -->
            <div class="pt-6 space-y-4">
                <p class="text-xs uppercase tracking-widest text-slate-500 font-semibold">Kit de botones</p>

                <div class="flex flex-wrap gap-4">

                    <!-- Botón principal: Verde / acción principal -->
                    <a href="../paginas/reservas.html"
                       class="inline-block bg-emerald-500 hover:bg-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-300/50 text-slate-900 text-lg font-bold px-8 py-4 rounded-full shadow-lg shadow-emerald-500/30 transition-colors duration-200">
                        Inscríbete
                    </a>

                    <!-- Botón secundario: Ámbar / acción alternativa -->
                    <a href="#info"
                       class="inline-block bg-amber-400 hover:bg-amber-300 focus:outline-none focus:ring-4 focus:ring-amber-300/50 text-slate-900 text-lg font-bold px-8 py-4 rounded-full shadow-lg shadow-amber-500/30 transition-colors duration-200">
                        Más información
                    </a>

                    <!-- Botón de contorno: solo borde / acción terciaria -->
                    <a href="#contacto"
                       class="inline-block border-2 border-slate-500 hover:border-white hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-slate-400/50 text-slate-100 text-lg font-bold px-8 py-4 rounded-full transition-colors duration-200">
                        Contacto
                    </a>

                </div>
            </div>

        </section>
    </main>

</body>
</html>
